<script>
  function layoutMasonryRowWise() {
    const container = document.getElementById('photo-gallery');
    const items = Array.from(container.getElementsByClassName('gallery-item'));
const containerWidth = container.clientWidth;
    let columns = 3;
    if (containerWidth < 600) columns = 1;
    else if (containerWidth < 900) columns = 2;
    else columns = 3;
    const gap = 10;
    const imageWidth = ((containerWidth - (columns - 1) * gap) )/ columns;
    const rowHeights = new Array(columns).fill(0);

    items.forEach(item => {
      item.style.position = 'absolute';
      item.style.width = `${imageWidth}px`;
    });

    items.forEach((item, index) => {
      const column = index % columns;
      const x = column * (imageWidth + gap);
      const img = item.querySelector('img');

      const aspectRatio = img.naturalHeight / img.naturalWidth;
      const displayHeight = imageWidth * aspectRatio;

      const y = rowHeights[column];

      item.style.left = `${x}px`;
      item.style.top = `${y}px`;

      rowHeights[column] += displayHeight + gap;
    });

    container.style.height = `${Math.max(...rowHeights)}px`;
  }

  function waitForImagesAndLayout() {
    const images = Array.from(document.querySelectorAll('#photo-gallery img'));
    const unloaded = images.filter(img => !img.complete);

    if (unloaded.length === 0) {
      layoutMasonryRowWise();
    } else {
      let loaded = 0;
      unloaded.forEach(img => {
        img.onload = img.onerror = () => {
          loaded++;
          if (loaded === unloaded.length) {
            layoutMasonryRowWise();
          }
        };
      });
    }
  }

  window.addEventListener('load', waitForImagesAndLayout);
  window.addEventListener('resize', () => {
    layoutMasonryRowWise(); 
  });
</script>
